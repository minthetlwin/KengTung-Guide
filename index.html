<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/keng_tung_pagoda_guide_emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Keng Tung Pagoda Guide — a living archive of the sacred pagodas, monasteries and pilgrimage routes of Kyaing Tong, Eastern Shan State." />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#A8781E" />

    <!--
      These tags are what social platforms and chat apps (Facebook, Twitter/X,
      Discord, iMessage, Slack, WhatsApp, ...) actually read when a link is
      shared — their scrapers fetch this raw HTML and do not run JavaScript,
      so this preview stays the same no matter which page of the site is
      linked. React (see src/hooks/usePageMeta.ts) updates the equivalent
      tags per-route for the browser tab and for crawlers that do execute
      JavaScript, such as Googlebot — but that never changes what a shared
      link preview shows.
      Replace the two "REPLACE_WITH_..." values below once the site has a
      real production domain, so scrapers can resolve an absolute image URL
      and a canonical link back to this exact site.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keng Tung Pagoda Guide" />
    <meta property="og:title" content="Keng Tung Pagoda Guide" />
    <meta property="og:description" content="A living archive of the sacred pagodas, monasteries and pilgrimage routes of Kyaing Tong, Eastern Shan State." />
    <meta property="og:image" content="REPLACE_WITH_PRODUCTION_URL/keng_tung_pagoda_guide_emblem.png" />
    <meta property="og:url" content="REPLACE_WITH_PRODUCTION_URL/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keng Tung Pagoda Guide" />
    <meta name="twitter:description" content="A living archive of the sacred pagodas, monasteries and pilgrimage routes of Kyaing Tong, Eastern Shan State." />
    <meta name="twitter:image" content="REPLACE_WITH_PRODUCTION_URL/keng_tung_pagoda_guide_emblem.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>Keng Tung Pagoda Guide</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Keng Tung Pagoda Guide",
        "description": "A living archive of the sacred pagodas, monasteries and pilgrimage routes of Kyaing Tong, Eastern Shan State.",
        "inLanguage": ["en", "my", "th"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
