<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ကျိုင်းတုံ ဘုရားလမ်းညွှန်သည် ရှမ်းပြည်နယ်(အရှေ့ပိုင်း) ကျိုင်းတုံမြို့ရှိ သန့်ရှင်းမြင့်မြတ်သော ဘုရားကျောင်းများ၊ ဘုရားဖူးလမ်းကြောင်းများကို ဘာသာစကားသုံးမျိုးဖြင့် မှတ်တမ်းတင်ထားသည့် ဒစ်ဂျစ်တယ် မော်ကွန်းတိုက်တစ်ခု ဖြစ်ပါသည်။" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#A8781E" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!--
      These tags are what social platforms and chat apps (Facebook, Messenger,
      Viber, Telegram, X, ...) actually read when a link is shared — their
      scrapers fetch this raw HTML and do not run JavaScript, so this preview
      stays the same no matter which page of the site is linked. React (see
      src/hooks/usePageMeta.ts) updates the equivalent tags per-route for the
      browser tab and for crawlers that do execute JavaScript, such as
      Googlebot. __SITE_URL__ is filled in at build time (see vite.config.ts).
      /og-image.jpg is the 1200×630 share card: Maha Myat Muni photo, logo and
      Myanmar title.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="my_MM" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="th_TH" />
    <meta property="og:site_name" content="မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားများ" />
    <meta property="og:title" content="မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားများ" />
    <meta property="og:description" content="ရှမ်းပြည်နယ်(အရှေ့ပိုင်း) ကျိုင်းတုံမြို့ရှိ မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားကျောင်းများ၊ ပွဲတော်များနှင့် ဘုရားဖူးလမ်းကြောင်းများကို မှတ်တမ်းတင်ထားသည့် ဒစ်ဂျစ်တယ် လမ်းညွှန်။" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ကျိုင်းတုံ မဟာမြတ်မုနိဘုရား" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားများ" />
    <meta name="twitter:description" content="ရှမ်းပြည်နယ်(အရှေ့ပိုင်း) ကျိုင်းတုံမြို့ရှိ မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားကျောင်းများ၊ ပွဲတော်များနှင့် ဘုရားဖူးလမ်းကြောင်းများကို မှတ်တမ်းတင်ထားသည့် ဒစ်ဂျစ်တယ် လမ်းညွှန်။" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <meta name="twitter:image:alt" content="ကျိုင်းတုံ မဟာမြတ်မုနိဘုရား" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Material Symbols is self-hosted (src/index.css) instead of loaded from
      Google Fonts: the full variable-axis family Google serves for it is a
      ~4MB single file with no per-icon splitting, which was the actual
      source of the slow icon loading. This preload fetches the ~390KB
      subset (see index.css for the regeneration command) in parallel with
      the initial HTML parse instead of after CSS discovers it.
    -->
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <title>မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားများ</title>
    <!--
      WebSite `name` is what Google shows as the site name above results;
      `alternateName` covers English searches. `publisher.logo` feeds the
      logo Google may show for the site.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားများ",
        "alternateName": ["Keng Tung Pagoda Guide", "Maha Myat Muni Pagoda, Kengtung"],
        "url": "__SITE_URL__/",
        "description": "ရှမ်းပြည်နယ်(အရှေ့ပိုင်း) ကျိုင်းတုံမြို့ရှိ မဟာမြတ်မုနိဘုရားနှင့် သမိုင်းဝင်ဘုရားကျောင်းများ၊ ပွဲတော်များနှင့် ဘုရားဖူးလမ်းကြောင်းများကို မှတ်တမ်းတင်ထားသည့် ဒစ်ဂျစ်တယ် လမ်းညွှန်။",
        "inLanguage": ["my", "en", "th"],
        "image": "__SITE_URL__/og-image.jpg",
        "publisher": {
          "@type": "Organization",
          "name": "Polytechnic University (Kyaing Tong)",
          "logo": "__SITE_URL__/icon-192.png"
        }
      }
    </script>

    <!--
      Applies the saved dark/light theme before first paint, so dark-mode
      visitors don't see a flash of the light theme while React boots.
    -->
    <script>
      try {
        if (localStorage.getItem('ktpg-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fbf9f5;
        transition: opacity 0.35s ease;
      }
      html.dark #app-loader {
        background: #0f1115;
      }
      #app-loader.app-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader-rings {
        position: relative;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-loader-rings img {
        position: relative;
        z-index: 1;
        width: 44px;
        height: 44px;
        object-fit: contain;
        animation: app-loader-pulse 1.8s ease-in-out infinite;
      }
      .app-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
      }
      .app-loader-ring-outer {
        border-top-color: #a8781e;
        border-right-color: #a8781e;
        animation: app-loader-spin 1.1s linear infinite;
      }
      .app-loader-ring-inner {
        inset: 16px;
        border-bottom-color: #a8781e;
        border-left-color: #a8781e;
        opacity: 0.55;
        animation: app-loader-spin-reverse 0.85s linear infinite;
      }
      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.85;
        }
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes app-loader-spin-reverse {
        to {
          transform: rotate(-360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <div class="app-loader-rings">
        <span class="app-loader-ring app-loader-ring-outer"></span>
        <span class="app-loader-ring app-loader-ring-inner"></span>
        <img src="/keng_tung_pagoda_guide_emblem.png" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
